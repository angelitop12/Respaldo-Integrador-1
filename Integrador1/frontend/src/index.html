<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>ToolStore · Sistema de gestión</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060A11">
  <!-- Icono de la pestaña: una llave sobre fondo oscuro con borde cian -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23060A11'/%3E%3Crect x='1' y='1' width='30' height='30' rx='6' fill='none' stroke='%2322D3EE' stroke-width='1.6'/%3E%3Cg transform='translate(5 5) scale(.9)' fill='none' stroke='%2322D3EE' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z'/%3E%3C/g%3E%3C/svg%3E">
  <!-- Tema guardado: se aplica antes de pintar para que no parpadee -->
  <script>try { if (localStorage.getItem('toolstore.tema') === 'claro') document.documentElement.setAttribute('data-tema', 'claro'); } catch (e) {}</script>
  <!-- Tipografías: Space Grotesk (títulos), Inter (texto) y JetBrains Mono (cifras) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
